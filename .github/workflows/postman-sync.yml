name: Postman Spec Sync

# Keeps HubSpot's public Postman workspace in step with this monorepo, using
# .postman/migration-state.json as the source-of-truth mapping (produced by the
# Phase 1 migration). Spec updates are non-destructive; collection updates are
# additive only. See .postman/README.md.

on:
  # Manual runs give you full control (preview first, then apply).
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = preview only (no writes) · apply = perform changes"
        type: choice
        required: true
        default: plan
        options: [plan, apply]
      collections:
        description: "Also update collections (new version folders, new endpoints, new services)"
        type: boolean
        default: false
      create-new:
        description: "Onboard brand-new services found in the repo"
        type: boolean
        default: true

  # Weekday mornings (UTC). Scheduled runs are PLAN-only until you set the repo
  # variable POSTMAN_SYNC_SCHEDULED_MODE=apply (Settings > Secrets and variables >
  # Actions > Variables). Scheduled runs never write collections.
  schedule:
    - cron: "0 7 * * 1-5"

concurrency:
  group: postman-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 60
    steps:
      # No token left in .git/config; the PR step pushes with it explicitly.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve run parameters
        id: cfg
        env:
          SCHEDULED_MODE: ${{ vars.POSTMAN_SYNC_SCHEDULED_MODE }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SCHEDULED_MODE" = "apply" ]; then echo "mode=apply" >> "$GITHUB_OUTPUT"; else echo "mode=plan" >> "$GITHUB_OUTPUT"; fi
            echo "collections=false" >> "$GITHUB_OUTPUT"
            echo "create=true"       >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}"               >> "$GITHUB_OUTPUT"
            echo "collections=${{ inputs.collections }}" >> "$GITHUB_OUTPUT"
            echo "create=${{ inputs.create-new }}"       >> "$GITHUB_OUTPUT"
          fi

      # The sync saves state even when some APIs fail, so this step never fails
      # the job directly: the PR step below must still run to keep that progress.
      - name: Run sync
        id: sync
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_WORKSPACE_ID: ${{ secrets.POSTMAN_WORKSPACE_ID }}
        run: |
          FLAGS="--${{ steps.cfg.outputs.mode }}"
          [ "${{ steps.cfg.outputs.collections }}" = "true" ] || FLAGS="$FLAGS --no-collections"
          [ "${{ steps.cfg.outputs.create }}" = "true" ]      || FLAGS="$FLAGS --no-create"
          echo "Running: node .postman/sync.mjs $FLAGS"
          set +e
          node .postman/sync.mjs $FLAGS > sync-report.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-sync-${{ github.run_id }}
          path: |
            sync-report.json
            .postman/migration-state.json
          retention-days: 90

      # One rolling PR (branch postman-sync/state) instead of a new PR per run.
      # Each run rebuilds the branch from the default branch plus that run's state,
      # so an unmerged PR just gets refreshed.
      - name: Open or update state PR
        if: always() && steps.cfg.outputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- .postman/migration-state.json; then
            echo ".postman/migration-state.json unchanged; no PR needed."
            exit 0
          fi
          BRANCH="postman-sync/state"
          git config user.name "postman-sync[bot]"
          git config user.email "postman-sync@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .postman/migration-state.json
          git commit -m "chore(postman): sync migration-state.json (run ${{ github.run_id }})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr comment "$BRANCH" --body "Refreshed by run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. See its sync-report.json artifact."
          else
            gh pr create --title "Postman sync: update migration-state.json" \
              --body "Automated Phase 2 sync updated the spec-to-collection mapping. Merge to record it; later runs refresh this same PR. See the run's sync-report.json artifact." \
              --base "${{ github.event.repository.default_branch }}" --head "$BRANCH"
          fi

      - name: Fail if the sync reported errors
        if: always() && steps.sync.outputs.exit != '0'
        run: |
          echo "Sync finished with errors (exit ${{ steps.sync.outputs.exit }}). See sync-report.json."
          exit 1
